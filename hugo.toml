# Theme defaults. Settings in your site's config take precedence.

[module]
  [module.hugoVersion]
    # css.Build with the vars option needs v0.160.0 or newer.
    min = "0.160.0"

[params]
  # Author name, used in meta tags, structured data and the footer.
  author = ""
  # Site description, used when a page has no description of its own.
  description = ""
  # Favicon path under static/, for example "favicon.png". Leave empty for no favicon.
  favicon = ""
  # Logo path under static/, used as the publisher logo in structured data.
  logo = ""
  # Fallback social preview images (og:image), for pages without images in front matter.
  images = []
  # Where the site title in the header links to. Defaults to the first main section.
  blogURL = ""

  # CSS variables. Set any of them under [params.style] in your site config.
  # color-link-underline and color-selection are not set here: they default to
  # color-accent at 35% and 15% opacity, and you can set them to override that.
  [params.style]
    font-body = "system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans,sans-serif"
    font-mono = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace'
    color-text = "#1f1f1f"
    color-bg = "#fdfdfc"
    color-muted = "#6b6b6b"
    color-quote = "#4a4a4a"
    color-accent = "#1d5fa8"
    color-code-bg = "#eee"
    color-border = "#ddd"
    color-table-head = "#f6f6f6"
    content-width = "66ch"
    content-width-mobile = "52ch"
